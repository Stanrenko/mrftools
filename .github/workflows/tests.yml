# Run the mrftools unit tests on every PR and on pushes to main / dev.
# tests/test_cli.py needs a local raw .dat file (data/ is not versioned): it is skipped here.

name: Tests (mrftools)

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]  # release environment / local development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.cfg

      - name: Install mrftools with test extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run tests
        run: python -m pytest -v -rs
