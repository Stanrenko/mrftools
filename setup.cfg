[metadata]
name = mrftools
description = MRF tools ...
version = 2.0.0

[options]
python_requires = >=3.7
install_requires = \
    numpy
    dask
    scipy
    scikit-learn
    pillow
    simpleitk
    finufft
    tqdm
    matplotlib
    requests
    pywavelets
    scikit-image
    # twixtools @ git+https://github.com/pehses/twixtools.git
    twixtools @ git+https://github.com/StanRenko/twixtools.git
    epgpy @ git+https://github.com/py-baudin/epgpy.git
packages = mrftools

[options.extras_require]
cupy = cupy
test =
    pytest>=7

[tool:pytest]
testpaths = tests
